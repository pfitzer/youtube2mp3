# This workflow builds the package with uv and uploads it to PyPI when a tag is pushed

name: Upload Python Package

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build-n-publish:
    name: Build and publish Python distributions to PyPI
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI accepts the OIDC token of this job instead of an API token
    environment:
      name: pypi
      url: https://pypi.org/p/youtube2mp3
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - name: Set up uv with Python 3.10
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: '3.10'
    - name: Build sdist and wheel
      run: uv build
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
