name: Unit Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7
    - name: Install ffmpeg
      # a stalled apt mirror must not block the job until the 6 hour default timeout
      timeout-minutes: 5
      run: |
        APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
        sudo apt-get $APT_OPTS update
        sudo apt-get $APT_OPTS install -y --no-install-recommends ffmpeg
    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --locked
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 . --exclude .venv,docs --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 . --exclude .venv,docs --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: uv run pytest
